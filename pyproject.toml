[project]
name = "ai-ad-backend"
version = "0.1.0"
description = "Backend API and business logic for AI Ad"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "minio>=7.2.15",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "psycopg[binary]>=3.2.9",
    "pydantic-settings>=2.14.2",
    "pyjwt[crypto]>=2.10.0",
    "python-dotenv>=1.1.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.41",
    "sqlmodel>=0.0.38",
    "uvicorn[standard]>=0.34.0",
    "xlrd>=2.0.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "mypy>=2.1.0",
    "pytest>=8.4.0",
    "ruff>=0.15.18",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
